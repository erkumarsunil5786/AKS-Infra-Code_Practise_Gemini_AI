name: 'Terraform CI/CD (Managed Identity)'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permissions remain standard, but auth logic changes
permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: 'Terraform Quality & Plan'
    runs-on: self-hosted # Managed Identity typically requires a self-hosted runner on Azure
    
    defaults:
      run:
        working-directory: ./environments/dev

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # --- Azure Login using Managed Identity ---
    # Note: The runner MUST be an Azure VM or Service with Managed Identity enabled
    - name: Azure Login
      uses: azure/login@v1
      with:
        auth-type: IDENTITY
        client-id: ${{ secrets.AZURE_CLIENT_ID }} # Optional: Specify if using User-Assigned Managed Identity

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Terraform Format
      run: terraform fmt -check

    - name: TFSec Scan
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        working_directory: ./environments/dev
        soft_fail: true

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v3
      with:
        tflint_version: v0.44.1

    - name: Run TFLint
      run: tflint -f compact

    - name: Terraform Init
      run: terraform init
      env:
        ARM_USE_MSI: true # Enable Managed Service Identity for Terraform
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      id: plan
      run: terraform plan -input=false -out=tfplan
      env:
        ARM_USE_MSI: true
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Upload Plan
      uses: actions/upload-artifact@v3
      with:
        name: tfplan
        path: ./environments/dev/tfplan

  terraform-apply:
    name: 'Terraform Apply'
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: terraform
    runs-on: self-hosted
    
    defaults:
      run:
        working-directory: ./environments/dev

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        auth-type: IDENTITY
        client-id: ${{ secrets.AZURE_CLIENT_ID }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Download Plan
      uses: actions/download-artifact@v3
      with:
        name: tfplan
        path: ./environments/dev/

    - name: Terraform Init
      run: terraform init
      env:
        ARM_USE_MSI: true
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan
      env:
        ARM_USE_MSI: true
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
